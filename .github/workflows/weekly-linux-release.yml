name: Codex Desktop Linux Release

on:
  schedule:
    # 14:17 UTC is 22:17 Asia/Shanghai. The local updater checks at 22:15.
    # The candidate-key check skips a build when neither upstream nor the DMG changed.
    - cron: "17 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-linux-release.yml"
      - ".github/linux-features.json"

permissions:
  contents: write
  attestations: write

concurrency:
  group: codex-desktop-linux-release
  cancel-in-progress: false

env:
  UPSTREAM_DMG_URL: https://persistent.oaistatic.com/codex-app-prod/ChatGPT.dmg
  UPSTREAM_DMG_PATH: /tmp/codex-upstream-ci/Codex.dmg
  DMG_CACHE_SCHEMA_VERSION: v1

jobs:
  build-and-release:
    name: Sync upstream, build, and publish Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync fork main with upstream main
        id: sync
        env:
          UPSTREAM_REPOSITORY: ilysenko/codex-desktop-linux
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          before_commit="$(git rev-parse HEAD)"
          upstream_commit="$(git rev-parse refs/remotes/upstream/main)"
          if git merge-base --is-ancestor "$upstream_commit" HEAD; then
            sync_action="already-current"
          elif git merge-base --is-ancestor HEAD "$upstream_commit"; then
            git merge --ff-only "$upstream_commit"
            sync_action="fast-forward"
          else
            # Keep local automation/features files while bringing in all upstream changes.
            git merge --no-edit "$upstream_commit"
            sync_action="merge"
          fi
          after_commit="$(git rev-parse HEAD)"
          if [ "$after_commit" != "$before_commit" ]; then
            git push origin "HEAD:main"
            pushed="true"
          else
            pushed="false"
          fi
          {
            echo "before_commit=$before_commit"
            echo "upstream_commit=$upstream_commit"
            echo "build_commit=$after_commit"
            echo "sync_action=$sync_action"
            echo "pushed=$pushed"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full make g++ python3 curl unzip jq dpkg-dev

      - name: Read upstream DMG headers
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          headers_file="$(mktemp)"
          trap 'rm -f "$headers_file"' EXIT
          curl -fsSLI --retry 3 "$UPSTREAM_DMG_URL" > "$headers_file"
          last_modified="$(awk 'tolower($0) ~ /^last-modified:/ {sub(/\r$/,""); sub(/^[^:]+: /,""); print; exit}' "$headers_file")"
          etag="$(awk 'tolower($0) ~ /^etag:/ {sub(/\r$/,""); sub(/^[^:]+: /,""); gsub(/"/,""); print; exit}' "$headers_file")"
          content_length="$(awk 'tolower($0) ~ /^content-length:/ {sub(/\r$/,""); sub(/^[^:]+: /,""); print; exit}' "$headers_file")"
          last_modified="${last_modified:-unknown}"
          etag="${etag:-no-etag}"
          content_length="${content_length:-unknown}"
          cache_segment="$(printf '%s|%s|%s\n' "$last_modified" "$etag" "$content_length" | sha256sum | cut -d' ' -f1)"
          {
            echo "last_modified=$last_modified"
            echo "etag=$etag"
            echo "content_length=$content_length"
            echo "cache_segment=$cache_segment"
          } >> "$GITHUB_OUTPUT"

      - name: Restore cached upstream DMG
        id: dmg-cache
        uses: actions/cache@v4
        with:
          path: /tmp/codex-upstream-ci/Codex.dmg
          key: upstream-dmg-${{ env.DMG_CACHE_SCHEMA_VERSION }}-${{ steps.upstream.outputs.cache_segment }}

      - name: Download upstream DMG
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$UPSTREAM_DMG_PATH")"
          curl -fL --retry 3 --retry-all-errors -o "$UPSTREAM_DMG_PATH" "$UPSTREAM_DMG_URL"

      - name: Record source and DMG metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s "$UPSTREAM_DMG_PATH"
          dmg_sha256="$(sha256sum "$UPSTREAM_DMG_PATH" | cut -d' ' -f1)"
          dmg_size_bytes="$(stat -c '%s' "$UPSTREAM_DMG_PATH")"
          tested_at_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          source_commit="$(git rev-parse HEAD)"
          upstream_commit="${{ steps.sync.outputs.upstream_commit }}"
          printf 'dmg_sha256=%s\n' "$dmg_sha256" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          printf 'upstream_commit=%s\n' "$upstream_commit" >> "$GITHUB_OUTPUT"
          printf 'tested_at_utc=%s\n' "$tested_at_utc" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg url "$UPSTREAM_DMG_URL" \
            --arg last_modified "${{ steps.upstream.outputs.last_modified }}" \
            --arg etag "${{ steps.upstream.outputs.etag }}" \
            --arg content_length "${{ steps.upstream.outputs.content_length }}" \
            --arg sha256 "$dmg_sha256" \
            --argjson size_bytes "$dmg_size_bytes" \
            --arg tested_at_utc "$tested_at_utc" \
            --arg source_commit "$source_commit" \
            --arg upstream_commit "$upstream_commit" \
            --arg cache_schema_version "$DMG_CACHE_SCHEMA_VERSION" \
            '{url:$url,last_modified:$last_modified,etag:$etag,content_length:$content_length,sha256:$sha256,size_bytes:$size_bytes,tested_at_utc:$tested_at_utc,source_commit:$source_commit,upstream_commit:$upstream_commit,cache_schema_version:$cache_schema_version}' \
            > upstream-dmg-metadata.json

      - name: Skip an unchanged candidate that already has a release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_key="${{ steps.metadata.outputs.source_commit }}:${{ steps.metadata.outputs.dmg_sha256 }}"
          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" 2>/dev/null \
            | jq -r --arg key "$candidate_key" \
              '.[] | select(.draft == false and .prerelease == false) | select((.body // "") | contains("Candidate-Key: " + $key)) | .tag_name' \
            | head -n1 || true)"
          if [ -n "$existing_tag" ]; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "existing_tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "Candidate already published as $existing_tag; skipping rebuild."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "existing_tag=" >> "$GITHUB_OUTPUT"
            echo "No release for candidate key $candidate_key; building."
          fi

      - name: Select the same Linux feature set as the local install
        if: steps.candidate.outputs.release_exists != 'true'
        run: cp .github/linux-features.json linux-features/features.json

      - name: Build app from upstream DMG
        if: steps.candidate.outputs.release_exists != 'true'
        run: |
          set -euo pipefail
          CODEX_PATCH_REPORT_JSON="$GITHUB_WORKSPACE/patch-report.json" \
            make build-app-fresh DMG="$UPSTREAM_DMG_PATH"

      - name: Validate patches and wrapper tests
        if: steps.candidate.outputs.release_exists != 'true'
        run: |
          set -euo pipefail
          node scripts/ci/validate-patch-report.js patch-report.json --profile upstream-build
          bash -n install.sh scripts/build-deb.sh
          node --test scripts/patch-linux-window-ui.test.js

      - name: Build Debian package without the resident updater
        id: package
        if: steps.candidate.outputs.release_exists != 'true'
        run: |
          set -euo pipefail
          PACKAGE_WITH_UPDATER=0 MAX_BUILD_THREADS=8 make deb
          deb_path="$(find dist -maxdepth 1 -type f -name 'codex-desktop_*.deb' -printf '%T@ %p\n' | sort -nr | awk 'NR==1 {sub(/^[^ ]+ /,""); print}')"
          test -n "$deb_path"
          deb_name="$(basename "$deb_path")"
          package_version="$(dpkg-deb -f "$deb_path" Version)"
          deb_sha256="$(sha256sum "$deb_path" | cut -d' ' -f1)"
          sha256sum "$deb_path" | sed "s#  $deb_path#  $deb_name#" > SHA256SUMS
          jq -n \
            --arg package_version "$package_version" \
            --arg deb_name "$deb_name" \
            --arg deb_sha256 "$deb_sha256" \
            --arg source_commit "${{ steps.metadata.outputs.source_commit }}" \
            --arg upstream_commit "${{ steps.metadata.outputs.upstream_commit }}" \
            --arg dmg_sha256 "${{ steps.metadata.outputs.dmg_sha256 }}" \
            --arg built_at_utc "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{package_version:$package_version,deb_name:$deb_name,deb_sha256:$deb_sha256,source_commit:$source_commit,upstream_commit:$upstream_commit,dmg_sha256:$dmg_sha256,built_at_utc:$built_at_utc,package_with_updater:false}' \
            > build-metadata.json
          {
            echo "deb_path=$deb_path"
            echo "deb_name=$deb_name"
            echo "package_version=$package_version"
            echo "deb_sha256=$deb_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Generate build provenance attestation
        if: steps.candidate.outputs.release_exists != 'true'
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: ${{ steps.package.outputs.deb_path }}

      - name: Create or reuse the release
        id: release
        if: steps.candidate.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          safe_version="${{ steps.package.outputs.package_version }}"
          safe_version="${safe_version//+/-}"
          release_tag="linux-${safe_version}-${{ steps.metadata.outputs.dmg_sha256 }}"
          release_title="Codex Desktop Linux ${safe_version}"
          candidate_key="${{ steps.metadata.outputs.source_commit }}:${{ steps.metadata.outputs.dmg_sha256 }}"
          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.metadata.outputs.source_commit }}" \
            --title "$release_title" \
            --notes "Automated daily candidate build from upstream ChatGPT.dmg.\n\nCandidate-Key: $candidate_key\nUpstream DMG SHA-256: ${{ steps.metadata.outputs.dmg_sha256 }}\nWrapper commit: ${{ steps.metadata.outputs.source_commit }}\nUpstream commit: ${{ steps.metadata.outputs.upstream_commit }}\nDebian package SHA-256: ${{ steps.package.outputs.deb_sha256 }}\nPackage excludes codex-update-manager; local installation is managed by the host updater."
          gh release upload "$release_tag" \
            "${{ steps.package.outputs.deb_path }}" \
            SHA256SUMS upstream-dmg-metadata.json build-metadata.json patch-report.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        run: |
          {
            echo "## Codex Desktop Linux Release"
            echo ""
            echo "- Sync action: ${{ steps.sync.outputs.sync_action }} (pushed: ${{ steps.sync.outputs.pushed }})"
            echo "- Upstream commit: ${{ steps.sync.outputs.upstream_commit }}"
            echo "- DMG SHA-256: ${{ steps.metadata.outputs.dmg_sha256 }}"
            if [ "${{ steps.candidate.outputs.release_exists }}" = "true" ]; then
              echo "- Existing release: ${{ steps.candidate.outputs.existing_tag }}"
              echo "- Build: skipped because the candidate key is unchanged"
            else
              echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/linux-${{ steps.package.outputs.package_version }}-${{ steps.metadata.outputs.dmg_sha256 }}"
              echo "- Package: ${{ steps.package.outputs.deb_name }}"
              echo "- Debian SHA-256: ${{ steps.package.outputs.deb_sha256 }}"
            fi
            echo "- Schedule: daily at 14:17 UTC (22:17 Asia/Shanghai)"
          } >> "$GITHUB_STEP_SUMMARY"

