# Disabled temporarily: move back to .github/workflows/ to re-enable.
name: Codex Desktop Linux Release

on:
  schedule:
    # 02:17 / 14:17 UTC = 10:17 / 22:17 Asia/Shanghai (every 12 hours).
    # The local updater on the laptop checks at 11:30 / 23:30 CST.
    - cron: "17 2,14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-linux-release.yml"
      - ".github/linux-features.json"

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: codex-desktop-linux-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Sync upstream, build from the official Linux package, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out fork
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Sync fork main with upstream main
        id: sync
        env:
          UPSTREAM_REPOSITORY: ilysenko/codex-desktop-linux
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          before_commit="$(git rev-parse HEAD)"
          upstream_commit="$(git rev-parse refs/remotes/upstream/main)"
          if git merge-base --is-ancestor "$upstream_commit" HEAD; then
            sync_action="already-current"
          elif git merge-base --is-ancestor HEAD "$upstream_commit"; then
            git merge --ff-only "$upstream_commit"
            sync_action="fast-forward"
          else
            # The fork only adds .github/linux-features.json and this workflow,
            # so a merge with upstream should never conflict.
            git merge --no-edit "$upstream_commit"
            sync_action="merge"
          fi
          after_commit="$(git rev-parse HEAD)"
          if [ "$after_commit" != "$before_commit" ]; then
            if ! git push origin "HEAD:main"; then
              # A connector or another workflow may have advanced main after
              # checkout. Merge that non-conflicting automation commit once.
              git fetch --no-tags origin main
              git merge --no-edit refs/remotes/origin/main
              git push origin "HEAD:main"
            fi
            after_commit="$(git rev-parse HEAD)"
            pushed="true"
          else
            pushed="false"
          fi
          {
            echo "before_commit=$before_commit"
            echo "upstream_commit=$upstream_commit"
            echo "build_commit=$after_commit"
            echo "sync_action=$sync_action"
            echo "pushed=$pushed"
          } >> "$GITHUB_OUTPUT"

      - name: Keep generated reports out of source provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "/patch-report.json"
            echo "/rebuild-report.json"
            echo "/transactions/"
            echo "/codex-app/"
            echo "/dist/"
            echo "/upstream/"
            echo "/SHA256SUMS"
            echo "/build-metadata.json"
            echo "/upstream-deb-metadata.json"
            echo "/release-notes.md"
          } >> .git/info/exclude

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg patchelf make g++ python3 curl jq

      - name: Resolve and verify the official signed Linux package
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          package="$(node scripts/lib/upstream-linux-package.js \
            --output-dir upstream/amd64 \
            --metadata upstream/amd64.json \
            --key-base64 assets/openai-codex-linux-repository-key.gpg.base64 \
            --arch amd64)"
          official_version="$(jq -er '.version' upstream/amd64.json)"
          official_sha256="$(jq -er '.sha256' upstream/amd64.json)"
          official_path="$(jq -er '.repositoryPath' upstream/amd64.json)"
          {
            echo "package=$package"
            echo "official_version=$official_version"
            echo "official_sha256=$official_sha256"
            echo "official_path=$official_path"
          } >> "$GITHUB_OUTPUT"

      - name: Skip an unchanged candidate that already has a release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_key="${{ steps.sync.outputs.build_commit }}:${{ steps.upstream.outputs.official_sha256 }}"
          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" 2>/dev/null \
            | jq -r --arg key "$candidate_key" \
              '.[] | select(.draft == false and .prerelease == false) | select((.body // "") | contains("Candidate-Key: " + $key)) | .tag_name' \
            | head -n1 || true)"
          if [ -n "$existing_tag" ]; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "existing_tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "Candidate already published as $existing_tag; skipping rebuild."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "existing_tag=" >> "$GITHUB_OUTPUT"
            echo "No release for candidate key $candidate_key; building."
          fi

      - name: Build the app from the official package with the fork's features
        if: steps.candidate.outputs.release_exists != 'true'
        env:
          CODEX_LINUX_FEATURES_CONFIG: ${{ github.workspace }}/.github/linux-features.json
          CODEX_PATCH_REPORT_JSON: ${{ github.workspace }}/patch-report.json
        run: ./install.sh "${{ steps.upstream.outputs.package }}"

      - name: Validate patches and wrapper tests
        if: steps.candidate.outputs.release_exists != 'true'
        run: |
          set -euo pipefail
          if [ -s patch-report.json ]; then
            node scripts/ci/validate-patch-report.js patch-report.json --profile upstream-build
          fi
          bash -n install.sh scripts/build-deb.sh
          node --test scripts/patch-linux-window-ui.test.js

      - name: Build the Debian package without the resident updater
        id: package
        if: steps.candidate.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_WITH_UPDATER=0 MAX_BUILD_THREADS=8 make deb
          deb_path="$(find dist -maxdepth 1 -type f -name 'codex-desktop_*_amd64.deb' -printf '%T@ %p\n' | sort -nr | awk 'NR==1 {sub(/^[^ ]+ /,""); print}')"
          test -n "$deb_path"
          deb_name="$(basename "$deb_path")"
          package_version="$(dpkg-deb -f "$deb_path" Version)"
          deb_sha256="$(sha256sum "$deb_path" | cut -d' ' -f1)"
          sha256sum "$deb_path" | sed "s#  $deb_path#  $deb_name#" > SHA256SUMS
          cp upstream/amd64.json upstream-deb-metadata.json
          jq -n \
            --arg package_version "$package_version" \
            --arg deb_name "$deb_name" \
            --arg deb_sha256 "$deb_sha256" \
            --arg source_commit "${{ steps.sync.outputs.build_commit }}" \
            --arg upstream_commit "${{ steps.sync.outputs.upstream_commit }}" \
            --arg official_version "${{ steps.upstream.outputs.official_version }}" \
            --arg official_repository_path "${{ steps.upstream.outputs.official_path }}" \
            --arg official_deb_sha256 "${{ steps.upstream.outputs.official_sha256 }}" \
            --arg built_at_utc "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{package_version:$package_version,deb_name:$deb_name,deb_sha256:$deb_sha256,source_commit:$source_commit,upstream_commit:$upstream_commit,official_version:$official_version,official_repository_path:$official_repository_path,official_deb_sha256:$official_deb_sha256,built_at_utc:$built_at_utc,package_with_updater:false}' \
            > build-metadata.json
          {
            echo "deb_path=$deb_path"
            echo "deb_name=$deb_name"
            echo "package_version=$package_version"
            echo "deb_sha256=$deb_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Generate build provenance attestation
        if: steps.candidate.outputs.release_exists != 'true'
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: ${{ steps.package.outputs.deb_path }}

      - name: Create the release
        id: release
        if: steps.candidate.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="linux-${{ steps.package.outputs.package_version }}-${{ steps.upstream.outputs.official_sha256 }}"
          release_title="Codex Desktop Linux ${{ steps.package.outputs.package_version }}"
          candidate_key="${{ steps.sync.outputs.build_commit }}:${{ steps.upstream.outputs.official_sha256 }}"
          {
            echo "Automated 12-hourly candidate build from the official signed Linux package."
            echo ""
            echo "Candidate-Key: $candidate_key"
            echo "Official package version: ${{ steps.upstream.outputs.official_version }}"
            echo "Official package SHA-256: ${{ steps.upstream.outputs.official_sha256 }}"
            echo "Official repository path: ${{ steps.upstream.outputs.official_path }}"
            echo "Wrapper commit: ${{ steps.sync.outputs.build_commit }}"
            echo "Upstream commit: ${{ steps.sync.outputs.upstream_commit }}"
            echo "Debian package SHA-256: ${{ steps.package.outputs.deb_sha256 }}"
            echo "Package excludes codex-update-manager; local installation is managed by the host updater."
          } > release-notes.md
          assets=("${{ steps.package.outputs.deb_path }}" SHA256SUMS upstream-deb-metadata.json build-metadata.json)
          [ -s patch-report.json ] && assets+=(patch-report.json)
          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.sync.outputs.build_commit }}" \
            --title "$release_title" \
            --notes-file release-notes.md
          gh release upload "$release_tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Codex Desktop Linux Release"
            echo ""
            echo "- Sync action: ${{ steps.sync.outputs.sync_action }} (pushed: ${{ steps.sync.outputs.pushed }})"
            echo "- Upstream commit: ${{ steps.sync.outputs.upstream_commit }}"
            echo "- Official package: ${{ steps.upstream.outputs.official_version }} (${{ steps.upstream.outputs.official_sha256 }})"
            if [ "${{ steps.candidate.outputs.release_exists }}" = "true" ]; then
              echo "- Existing release: ${{ steps.candidate.outputs.existing_tag }}"
              echo "- Build: skipped because the candidate key is unchanged"
            else
              echo "- Release: ${{ steps.release.outputs.release_tag }}"
              echo "- Package: ${{ steps.package.outputs.deb_name }}"
              echo "- Debian SHA-256: ${{ steps.package.outputs.deb_sha256 }}"
            fi
            echo "- Schedule: every 12 hours at 02:17 / 14:17 UTC (10:17 / 22:17 Asia/Shanghai)"
          } >> "$GITHUB_STEP_SUMMARY"
